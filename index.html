<!doctype html>
<html lang="en">
<head>
  <!-- Touchline Manager. Copyright (c) 2026 Sudhi and Forge Frame. All rights reserved. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1610">
<title>Touchline Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Forge Frame studio splash: shown once per launch, about two seconds, tap to skip. Inline so it
     appears before the game scripts finish loading. Copied from forgeframehq/rts-game. -->
<div id="studio" onclick="this.classList.add('out')">
  <img src="assets/ui/studio_logo.png" alt="Forge Frame">
  <p>presents</p>
</div>
<script>
  (function () {
    var s = document.getElementById('studio');
    var gone = function () { if (s && s.parentNode) s.parentNode.removeChild(s); };
    s.addEventListener('transitionend', function (e) { if (e.target === s && s.classList.contains('out')) gone(); });
    var t0 = Date.now(), out = function () { s.classList.add('out'); setTimeout(gone, 900); };
    window.addEventListener('load', function () { setTimeout(out, Math.max(300, 2000 - (Date.now() - t0))); });
    setTimeout(out, 8000);
  })();
</script>

<!-- ============ Title ============ -->
<section id="title" class="screen title">
  <div class="title-panel">
    <div id="logo"><span class="l1">Touchline</span><span class="l2">Manager</span></div>
    <p class="tagline">Pick a club. Build a side. Lift the trophy.</p>
    <button id="btn-new" class="mbtn primary"><span>New Career</span><small>Take charge of any club</small></button>
    <button id="btn-continue" class="mbtn" disabled><img src="assets/ui/icons/clock.png" alt=""><span>Continue</span><small id="continue-sub">No saved career</small></button>
    <button id="btn-quick" class="mbtn"><img src="assets/ui/icons/special.png" alt=""><span>Quick Match</span><small>One game, no save</small></button>
    <div class="studio-credit"><img src="assets/ui/studio_mark.png" alt=""><span>A Forge Frame game</span></div>
  </div>
</section>

<!-- ============ Club picker ============ -->
<section id="pick" class="screen hidden">
  <div class="sheet">
    <header class="sheet-head"><button class="back" data-go="title" aria-label="Back">‹</button><h2>Choose Your Club</h2></header>
    <div class="sheet-body" id="club-list"></div>
    <footer class="sheet-foot"><button id="btn-take" class="play grand" disabled>Take Charge</button></footer>
  </div>
</section>

<!-- ============ Club hub ============ -->
<section id="hub" class="screen hidden">
  <div class="sheet">
    <header class="sheet-head"><span id="hub-crest" class="head-crest"></span><h2 id="hub-club"></h2><span id="hub-week" class="chip"></span></header>
    <div class="sheet-body" id="hub-body"></div>
    <footer class="sheet-foot hub-foot">
      <button id="btn-play" class="play grand">Play Match</button>
      <nav class="tabs">
        <button data-tab="squad" class="on"><i class="shirt"></i><span>Squad</span></button>
        <button data-tab="tactics"><img src="assets/ui/icons/rally.png" alt=""><span>Tactics</span></button>
        <button data-tab="fixtures"><img src="assets/ui/icons/menu.png" alt=""><span>Fixtures</span></button>
        <button data-tab="table"><img src="assets/ui/icons/laurel.png" alt=""><span>Table</span></button>
        <button data-tab="finance"><img src="assets/ui/icons/gold.png" alt=""><span>Finance</span></button>
      </nav>
    </footer>
  </div>
</section>

<!-- ============ Match ============ -->
<section id="match" class="screen hidden">
  <div class="sheet">
    <div class="scoreboard">
      <div class="sb-team"><span id="m-hcrest"></span><b id="m-home"></b></div>
      <div class="sb-mid"><b id="m-score">0 – 0</b><em id="m-clock">0'</em></div>
      <div class="sb-team"><span id="m-acrest"></span><b id="m-away"></b></div>
    </div>
    <div class="sheet-body match-body">
      <section class="frame pitch-frame"><canvas id="pitch-canvas"></canvas></section>
      <section class="frame feed-frame"><h3 class="ribbon">Commentary</h3><div id="m-feed" class="feed"></div></section>
    </div>
    <footer class="sheet-foot">
      <div class="seg">
        <button id="m-speed">1×</button>
        <button id="m-tactics">Tactics</button>
        <button id="m-skip">Skip to End</button>
      </div>
    </footer>
  </div>
</section>

<!-- ============ Result ============ -->
<section id="result" class="screen hidden overlay">
  <div class="card">
    <h2 id="r-head"></h2>
    <div id="r-summary"></div>
    <button id="btn-back-hub" class="big">Back to Club</button>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/rng.js"></script>
<script src="js/save.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
