<!doctype html>
<html lang="en">
<head>
  <!-- Touchline Manager. Copyright (c) 2026 Sudhi and Forge Frame. All rights reserved. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1a12">
<title>Touchline Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Forge Frame studio splash: shown once per launch, about two seconds, tap to skip. Inline so it
     appears before the game scripts finish loading. Copied from forgeframehq/rts-game. -->
<div id="studio" onclick="this.classList.add('out')">
  <img src="assets/ui/studio_logo.png" alt="Forge Frame">
  <p>presents</p>
</div>
<script>
  (function () {
    var s = document.getElementById('studio');
    var gone = function () { if (s && s.parentNode) s.parentNode.removeChild(s); };
    s.addEventListener('transitionend', function (e) { if (e.target === s && s.classList.contains('out')) gone(); });
    var t0 = Date.now(), out = function () { s.classList.add('out'); setTimeout(gone, 900); };
    window.addEventListener('load', function () { setTimeout(out, Math.max(300, 2000 - (Date.now() - t0))); });
    setTimeout(out, 8000);
  })();
</script>

<!-- Title screen -->
<section id="title" class="screen">
  <h1>Touchline<br>Manager</h1>
  <p class="tagline">Pick a club. Build a side. Earn the badge.</p>
  <div class="menu">
    <button id="btn-new" class="big">New Career</button>
    <button id="btn-continue" class="big" disabled>Continue</button>
    <button id="btn-quick" class="big">Quick Match</button>
  </div>
  <div class="studio-credit"><img src="assets/ui/studio_mark.png" alt=""><span>A Forge Frame game</span></div>
</section>

<!-- Club picker -->
<section id="pick" class="screen hidden">
  <header class="bar"><button class="back" data-go="title">‹</button><h2>Choose your club</h2></header>
  <div id="club-list" class="list"></div>
</section>

<!-- Club hub: one screen, one job each (tabs below) -->
<section id="hub" class="screen hidden">
  <header class="bar"><h2 id="hub-club"></h2><span id="hub-week"></span></header>
  <div id="hub-body"></div>
  <nav class="tabs">
    <button data-tab="squad" class="on">Squad</button>
    <button data-tab="tactics">Tactics</button>
    <button data-tab="fixtures">Fixtures</button>
    <button data-tab="table">Table</button>
    <button data-tab="finance">Finance</button>
  </nav>
  <button id="btn-play" class="big play">Play next match ›</button>
</section>

<!-- Match screen -->
<section id="match" class="screen hidden">
  <header class="bar score"><span id="m-home"></span><b id="m-score">0 – 0</b><span id="m-away"></span><em id="m-clock">0'</em></header>
  <div id="pitch"><canvas id="pitch-canvas"></canvas></div>
  <div id="m-feed" class="feed"></div>
  <div class="row">
    <button id="m-speed" class="small">1×</button>
    <button id="m-tactics" class="small">Tactics</button>
    <button id="m-skip" class="small">Skip to end</button>
  </div>
</section>

<!-- Results -->
<section id="result" class="screen hidden">
  <h2 id="r-head"></h2>
  <div id="r-summary"></div>
  <button id="btn-back-hub" class="big">Back to club ›</button>
</section>

<script src="js/data.js"></script>
<script src="js/rng.js"></script>
<script src="js/save.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
