# Builds the Godot version of the game (godot/) into an Android APK and attaches it to a GitHub Release.
# Runs when a commit message contains [godot], on the godot or main branch.
# The APK is signed with the debug key in godot/android/debug.keystore, so each new build installs over the last one.
name: Godot Android build
on:
  push:
    branches: [godot, fresh, main]
jobs:
  build:
    if: contains(github.event.head_commit.message, '[godot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.5.1
      VERSION_NAME: 3.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Get Godot and its Android export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL --retry 5 -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSL --retry 5 -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 $RUNNER_TEMP/godot
          t=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $t && unzip -q -j templates.tpz 'templates/android_*' 'templates/version.txt' -d $t && ls -la $t
          rm godot.zip templates.tpz
      - name: Point Godot at the Android SDK, Java and the signing key
        run: |
          mkdir -p $HOME/.config/godot
          cat > $HOME/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/godot/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' $HOME/.config/godot/editor_settings-4.5.tres
          ls $ANDROID_HOME/build-tools
      - name: Export the APK
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/godot/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"$VERSION_NAME\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"$VERSION_NAME\"/" project.godot
          mkdir -p build
          $RUNNER_TEMP/godot --headless --import 2>&1 | tail -5 || true
          $RUNNER_TEMP/godot --headless --export-debug "Android" build/touchline-manager-godot-$VERSION_NAME.apk 2>&1 | tee $RUNNER_TEMP/build.log
          ls -la build && test -s build/touchline-manager-godot-$VERSION_NAME.apk
      - name: Share the build log on the ci-logs branch
        if: failure()
        run: |
          cd $RUNNER_TEMP && rm -rf logs && mkdir logs && cd logs && git init -q && cp ../build.log . || echo "no log" > build.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "godot build log ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: touchline-manager-godot-apk
          path: godot/build/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Touchline Manager (Godot) ${{ env.VERSION_NAME }}
          body: Touchline Manager, built from scratch in Godot. Install the APK on an Android phone (allow installs from this source when asked). It installs over earlier Godot builds; careers from those builds do not carry over.
          files: godot/build/*.apk
